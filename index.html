<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantellis Factory Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header + tabs, one working surface below; board is a dense scannable table. */
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1b2b28; --muted:#5f6f6b; --line:#dde2de;
  --accent:#0e6b5c; --accent-ink:#ffffff; --accent-soft:#e1f0ec;
  --good:#2a7d3f; --good-soft:#e2f2e6; --warn:#a86300; --warn-soft:#fbefd5; --crit:#b3261e; --crit-soft:#fbe4e2;
  --display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif; --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a18; --panel:#1b2623; --ink:#e6eeeb; --muted:#9aaca7; --line:#2d3b37;
  --accent:#4cc3ad; --accent-ink:#0b1a17; --accent-soft:#1f3a34;
  --good:#6cd08a; --good-soft:#1e3626; --warn:#f0b14a; --warn-soft:#3b2f16; --crit:#ff8d85; --crit-soft:#41211f; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121a18; --panel:#1b2623; --ink:#e6eeeb; --muted:#9aaca7; --line:#2d3b37;
  --accent:#4cc3ad; --accent-ink:#0b1a17; --accent-soft:#1f3a34;
  --good:#6cd08a; --good-soft:#1e3626; --warn:#f0b14a; --warn-soft:#3b2f16; --crit:#ff8d85; --crit-soft:#41211f; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:14px 0}
.top h1{font-size:22px;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who label{font-size:12px;color:var(--muted)}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button:hover{color:var(--ink)}
nav .badge{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 7px;font-size:12px;margin-left:6px}
main{padding:18px 0 60px}
.banner{border:1px solid var(--line);background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.banner.info{background:var(--accent-soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .n{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.bar .f{display:flex;flex-direction:column;gap:3px}
.bar label{font-size:12px;color:var(--muted)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-height:36px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:7px 12px;font-weight:600;cursor:pointer;min-height:36px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{min-height:30px;padding:4px 9px;font-size:13px}
.btn.danger{background:transparent;color:var(--crit);border:1px solid var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:18px;margin-bottom:8px}
.card h3{font-size:15px;margin-bottom:6px}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--bg);position:sticky;top:0;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td .nm{font-weight:600}
td .meta{color:var(--muted);font-size:12px}
.prog{min-width:170px}
.track{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--muted)}
.fill.near{background:var(--warn)} .fill.go{background:var(--good)}
.ptxt{font-size:12px;color:var(--muted);margin-top:3px}
.chip{display:inline-block;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.go{background:var(--good-soft);color:var(--good)} .chip.near{background:var(--warn-soft);color:var(--warn)}
.chip.far{background:var(--bg);color:var(--muted);border:1px solid var(--line)} .chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.qty{width:70px}
.ordprog{display:flex;align-items:center;gap:8px;min-width:200px}.ordprog .track{width:110px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.muted{color:var(--muted)} .small{font-size:13px}
.spark{display:block}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:9;max-width:90%}
.tot td{border:0;padding:3px 10px} .tot tr:last-child td{font-weight:700;border-top:1px solid var(--line)}
.ord{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px}
.ord>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.ord>summary::-webkit-details-marker{display:none}
.ord .body{padding:0 14px 12px}
.empty{padding:26px;text-align:center;color:var(--muted)}
@media (max-width:640px){.top h1{font-size:19px}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .3s}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div><h1>Mantellis Factory Orders</h1><div class="sub" id="conn"></div></div>
    <div class="who" id="who"></div>
  </div>
  <nav id="tabs" role="tablist"></nav>
</div></header>
<main><div class="wrap" id="main"></div></main>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const CATALOG_FALLBACK = [];
const DAY = 86400000, WEEK = 7 * DAY;
const S = {
  catalog: [], catalogFromDb: false, pars: {}, parsLoaded: false,
  settings: { defaultPar: 10, vat: 15, deliveryFee: 0, leadDays: 10, closeFrom: '2026-11-23', reopen: '2027-01-05', lastDelivery: '2026-12-20', ratePerKg: 0, stores: [{ id: 'belvedere-square', name: 'Belvedere Square', fee: null, region: 'Western Cape' },{ id: 'blaauwberg', name: 'Blaauwberg', fee: null, region: 'Western Cape' },{ id: 'durbanville', name: 'Durbanville', fee: null, region: 'Western Cape' },{ id: 'fish-hoek', name: 'Fish Hoek', fee: null, region: 'Western Cape' },{ id: 'george', name: 'George', fee: null, region: 'Western Cape' },{ id: 'kenilworth-centre', name: 'Kenilworth Centre', fee: null, region: 'Western Cape' },{ id: 'mossel-bay', name: 'Mossel Bay', fee: null, region: 'Western Cape' },{ id: 'mutualpark', name: 'Mutualpark', fee: null, region: 'Western Cape' },{ id: 'paarl', name: 'Paarl', fee: null, region: 'Western Cape' },{ id: 'palmyra-junction', name: 'Palmyra Junction', fee: null, region: 'Western Cape' },{ id: 'rylands', name: 'Rylands', fee: null, region: 'Western Cape' },{ id: 'sanlam-direct', name: 'Sanlam Direct', fee: null, region: 'Western Cape' },{ id: 'somerset-west', name: 'Somerset West', fee: null, region: 'Western Cape' },{ id: 'stellenbosch', name: 'Stellenbosch', fee: null, region: 'Western Cape' },{ id: 'westlake', name: 'Westlake', fee: null, region: 'Western Cape' },{ id: 'fourways', name: 'Fourways', fee: null, region: 'Gauteng' },{ id: 'simmonds-street', name: 'Simmonds Street', fee: null, region: 'Gauteng' },{ id: 'ballito', name: 'Ballito', fee: null, region: 'KwaZulu-Natal' },{ id: 'kloof', name: 'Kloof', fee: null, region: 'KwaZulu-Natal' }] },
  orders: [], board: {}, hist: [], profiles: [], profile: null, auth: 'boot', authMsg: '', authEm: '', cart: {}, tab: 'board',
  f: { q: '', list: 'all', state: 'all', sort: 'close' },
  of: { store: 'all', status: 'open' }, aview: 'product',
  inv: { store: 'somerset-west', no: '', date: '', lines: null, bad: [], file: '', text: '' }, invoices: [], invMsg: '',
  me: { storeId: null }, admin: false, userId: null,
  demo: false, conn: 'connecting', method: 'collect', needBy: '', notes: '', fcMsg: '', importLog: '', exportText: '',
  adminQ: '', up: null
};
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => 'R ' + (Number(n) || 0).toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (n) => (Number(n) || 0).toLocaleString('en-ZA', { maximumFractionDigits: 1 });
const slug = (s) => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const weekIdx = (ms) => Math.floor((ms - 4 * DAY) / WEEK);
const ymd = (ms) => new Date(ms).toISOString().slice(0, 10);
const addBD = (ms, n) => { let d = ms, c = 0; while (c < n) { d += DAY; const w = new Date(d).getUTCDay(); if (w !== 0 && w !== 6) c++; } return d; };
const fdate = (ms) => new Date(ms).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const subBD = (ms, n) => { let d = ms, c = 0; while (c < n) { d -= DAY; const w = new Date(d).getUTCDay(); if (w !== 0 && w !== 6) c++; } return d; };
const afterLastDelivery = (ms) => !!(S.settings.lastDelivery && ymd(ms) > S.settings.lastDelivery);
const isClosed = (ms) => { const s = S.settings, k = ymd(ms == null ? Date.now() : ms); return !!(s.closeFrom && s.reopen && k >= s.closeFrom && k < s.reopen); };
function windowBanner() {
  const s = S.settings; if (!s.closeFrom || !s.reopen) return '';
  const now = Date.now(), cf = Date.parse(s.closeFrom + 'T00:00:00Z'), ro = Date.parse(s.reopen + 'T00:00:00Z'), ld = s.lastDelivery ? Date.parse(s.lastDelivery + 'T00:00:00Z') : 0;
  const dl = ld ? ' Stock that is ready is collected or delivered until ' + fdate(ld) + '. A product must start production by ' + fdate(subBD(ld, s.leadDays)) + ' to be ready by then; anything later is held until January.' : '';
  if (isClosed()) return '<div class="banner">The factory is closed to new orders until ' + fdate(ro) + '.' + dl + '</div>';
  const left = Math.ceil((cf - now) / DAY);
  if (left > 0 && left <= 60) return '<div class="banner">The factory stops taking new orders on ' + fdate(cf) + ' (' + left + ' day' + (left === 1 ? '' : 's') + ' left) and reopens on ' + fdate(ro) + '. Products still short of par when it closes will not be produced until January. Production takes ' + s.leadDays + ' business days from the day it starts.' + dl + '</div>';
  return '';
}
const LISTS = { collection: 'Collection', corporate: 'Corporate', hamper: 'Hamper' };
const STATUS = { pending: 'Waiting for production', production: 'In production', ready: 'Ready', done: 'Collected / delivered', cancelled: 'Cancelled' };

/* ---------- Supabase ---------- */
let sb = null;
const q = async (p) => { const r = await p; if (r.error) throw r.error; return r.data; };
async function pageAll(build) { const out = []; for (let from = 0; ; from += 1000) { const rows = await q(build().range(from, from + 999)); out.push(...rows); if (rows.length < 1000) break; } return out; }
async function run(p, ok) {
  if (S.demo) { toast('Demo mode: nothing is saved.'); return false; }
  try { const r = await p; if (r && r.error) throw r.error; await refresh(); if (ok) toast(ok); return r || true; }
  catch (e) { toast((e && e.message) || 'Could not save.'); return false; }
}

/* ---------- helpers on the catalogue and orders ---------- */
const cat = () => S.catalog.length ? S.catalog : CATALOG_FALLBACK;
const prodMap = () => { const m = {}; cat().forEach((p) => { m[p.code] = p; }); return m; };
const parOf = (p) => p.kind === 'supply' ? 0 : (S.pars[p.code] > 0 ? S.pars[p.code] : S.settings.defaultPar);
const isPlaceholderPar = (p) => p.kind !== 'supply' && !(S.pars[p.code] > 0);
const storeName = (id) => { const s = S.settings.stores.find((x) => x.id === id); return s ? s.name : id; };
const feeFor = (id) => { const s = S.settings.stores.find((x) => x.id === id); return s && s.fee != null && s.fee !== '' ? Number(s.fee) : Number(S.settings.deliveryFee) || 0; };

const DEFAULTS = { defaultPar: 10, vat: 15, leadDays: 10, closeFrom: '', reopen: '', lastDelivery: '', ratePerKg: 0 };
function mapOrders(rows) {
  return rows.map((o) => ({
    id: o.id, uid: o.store_id, storeId: o.store_id, storeName: storeName(o.store_id), createdAt: Date.parse(o.created_at), createdBy: o.created_by,
    method: o.method, fee: o.delivery_cost == null ? null : Number(o.delivery_cost), palletKg: o.pallet_kg == null ? null : Number(o.pallet_kg), needBy: o.need_by || '', notes: o.notes || '',
    lines: (o.order_lines || []).slice().sort((a, b) => a.id - b.id).map((l) => ({ id: l.id, code: l.code, cases: l.cases, price: Number(l.price), status: l.status, filled: l.filled || 0, releasedAt: l.released_at ? Date.parse(l.released_at) : null }))
  }));
}
async function loadAll() {
  const [stores, prods, set] = await Promise.all([
    q(sb.from('stores').select('*').eq('active', true).order('name')),
    pageAll(() => sb.from('products').select('*').order('code')),
    q(sb.from('settings').select('data').eq('id', 1))
  ]);
  S.settings = Object.assign({}, DEFAULTS, (set[0] && set[0].data) || {}, { stores: stores.map((s) => ({ id: s.id, name: s.name, region: s.region, fee: null })) });
  S.catalog = prods.map((p) => ({ code: p.code, name: p.name, lists: p.lists || [], category: p.category, pack: p.pack, perCase: p.per_case, casePrice: Number(p.case_price), unitPrice: p.unit_price, rrp: p.rrp, barcode: p.barcode, kind: p.kind, par: p.par, active: p.active }));
  S.pars = {}; S.catalog.forEach((p) => { if (p.par > 0) S.pars[p.code] = p.par; });
  S.catalogFromDb = true;
  S.orders = mapOrders(await pageAll(() => sb.from('orders').select('*, order_lines(*)').order('created_at', { ascending: false }).order('id')));
  if (S.admin) {
    S.hist = (await pageAll(() => sb.from('history').select('order_date,store_id,code,cases').order('id'))).map((r) => ({ t: Date.parse(r.order_date + 'T12:00:00Z'), store: r.store_id, code: r.code, cases: r.cases }));
    S.profiles = await q(sb.from('profiles').select('*').order('email'));
    try { S.invoices = await q(sb.from('invoices').select('id,invoice_no,store_id,inv_date,created_at,lines,result,reversed_at').order('created_at', { ascending: false })); } catch (e) { S.invoices = []; }
  } else {
    const b = await q(sb.rpc('get_board')); S.board = {}; b.forEach((r) => { S.board[r.code] = { cases: Number(r.cases), stores: Number(r.stores) }; });
  }
}
async function refresh() { if (S.demo || S.auth !== 'in') return; try { await loadAll(); S.conn = 'ok'; } catch (e) { S.conn = 'error'; } draw(); }

function derive() {
  const pend = {}, mine = {}, by = {}, stc = {}, seen = {};
  let openCases = 0, openValue = 0;
  S.orders.forEach((o) => (o.lines || []).forEach((l) => {
    if (l.status === 'pending') {
      if (S.admin) { pend[l.code] = (pend[l.code] || 0) + l.cases; (by[l.code] = by[l.code] || []).push({ store: o.storeName || storeName(o.storeId), cases: l.cases, method: o.method }); const k = l.code + '|' + (o.uid || o.storeId); if (!seen[k]) { seen[k] = 1; stc[l.code] = (stc[l.code] || 0) + 1; } }
      if (o.storeId === S.me.storeId) mine[l.code] = (mine[l.code] || 0) + l.cases;
    }
    if (l.status !== 'done' && l.status !== 'cancelled') { if (S.admin) openCases += l.cases; openValue += l.cases * (l.price || 0); }
  }));
  if (!S.admin) Object.keys(S.board || {}).forEach((c) => { const b = S.board[c]; pend[c] = b.cases; stc[c] = b.stores; openCases += b.cases; });
  S.d = { pend, mine, by, stc, openCases, openValue };
}
function stateOf(p) {
  const par = parOf(p), pend = S.d.pend[p.code] || 0;
  if (par === 0) return { key: 'stock', label: 'Ships from stock', pct: 0, par, pend, left: 0 };
  const pct = Math.min(pend / par, 1);
  if (pend >= par) return { key: 'go', label: 'In production queue', pct: 1, par, pend, left: 0 };
  return { key: pct >= 0.6 ? 'near' : 'far', label: pct >= 0.6 ? 'Close' : 'Waiting', pct, par, pend, left: par - pend };
}
function orderStatus(o) {
  const ls = (o.lines || []).filter((l) => l.status !== 'cancelled');
  if (!ls.length) return 'cancelled';
  if (ls.every((l) => l.status === 'done')) return 'done';
  if (ls.every((l) => l.status === 'done' || l.status === 'ready')) return 'ready';
  if (ls.some((l) => l.status === 'production' || l.status === 'ready' || l.status === 'done')) return 'production';
  return 'pending';
}
const orderTotals = (o) => {
  const sub = (o.lines || []).filter((l) => l.status !== 'cancelled').reduce((a, l) => a + l.cases * (l.price || 0), 0);
  const fee = o.method === 'deliver' && o.fee != null ? Number(o.fee) || 0 : 0, tbc = o.method === 'deliver' && o.fee == null;
  const vat = (sub + fee) * (Number(S.settings.vat) || 0) / 100;
  return { sub, fee, vat, total: sub + fee + vat, tbc };
};

/* ---------- forecasting ---------- */
function events() {
  const ev = [];
  S.hist.forEach((h) => { if (h.t && h.code) ev.push({ t: h.t, store: h.store, code: h.code, cases: h.cases }); });
  S.orders.forEach((o) => (o.lines || []).forEach((l) => { if (l.status !== 'cancelled') ev.push({ t: o.createdAt, store: o.storeId, code: l.code, cases: l.cases }); }));
  return ev;
}
function forecastAll() {
  const ev = events(), cur = weekIdx(Date.now()), series = {}, first = {};
  ev.forEach((e) => {
    const i = weekIdx(e.t) - (cur - 51);
    if (i < 0 || i > 51) { if (weekIdx(e.t) < cur - 51) first[e.code] = Math.min(first[e.code] ?? 1e9, weekIdx(e.t)); return; }
    (series[e.code] = series[e.code] || new Array(52).fill(0))[i] += e.cases;
    first[e.code] = Math.min(first[e.code] ?? 1e9, weekIdx(e.t));
  });
  const out = {};
  Object.keys(series).forEach((code) => {
    const s = series[code], trailArr = s.slice(43, 51), trail = trailArr.reduce((a, b) => a + b, 0) / 8;
    const sd = Math.sqrt(trailArr.reduce((a, b) => a + (b - trail) ** 2, 0) / 8), cv = trail > 0 ? sd / trail : 0;
    const span = cur - first[code], hasYear = span >= 50;
    let f4 = 0;
    for (let k = 1; k <= 4; k++) {
      const ly = (s[Math.max(k - 2, 0)] + s[k - 1] + s[Math.min(k, 51)]) / 3;
      f4 += hasYear ? 0.6 * trail + 0.4 * ly : trail;
    }
    let conf = span < 8 ? 'low' : (span < 40 ? 'medium' : 'high');
    if (cv > 1.2 && conf !== 'low') conf = conf === 'high' ? 'medium' : 'low';
    out[code] = { trail, f4, cv, span, hasYear, conf, spark: s.slice(-13), total: s.reduce((a, b) => a + b, 0) };
  });
  return out;
}

/* ---------- order actions ---------- */
async function patchLines(code, from, to) {
  const upd = { status: to }; if (to === 'production') upd.released_at = new Date().toISOString();
  const r = await run(sb.from('order_lines').update(upd).eq('code', code).eq('status', from).select('id'));
  return r && r.data ? r.data.length : 0;
}
async function submitOrder() {
  const p = prodMap(), codes = Object.keys(S.cart).filter((c) => S.cart[c] > 0 && p[c]);
  if (isClosed() && !S.admin) return toast('The factory is closed to new orders until ' + fdate(Date.parse(S.settings.reopen + 'T00:00:00Z')) + '.');

async function loadSheet(file) {

  try {
    const wb = XLSX.read(await readBuf(file), { type: 'array' }), sheets = [];
    wb.SheetNames.forEach((n) => {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' });
      const h = rows.findIndex((r) => r.some((c) => /^\s*code\s*$/i.test(String(c)))); if (h < 0) return;
      const hdr = rows[h].map((c) => String(c));
      let q = hdr.findIndex((c) => /order|qty|quant/i.test(c) || (/\bcases?\b/i.test(c) && !/per|price/i.test(c)));
      if (q < 0) { let last = -1; hdr.forEach((c, i) => { if (/price|barcode|units/i.test(c)) last = i; }); q = last + 1; }
      const pc = hdr.findIndex((c) => /case price/i.test(c));
      let store = '';
      for (let i = 0; i < h; i++) { const r = rows[i], k = r.findIndex((c) => /store\s*name/i.test(String(c))); if (k >= 0) { const own = String(r[k]).replace(/.*store\s*name\s*:?/i, '').trim(); store = own || String(r.slice(k + 1).find((c) => String(c).trim()) || '').trim(); } }
      sheets.push({ name: n, rows, h, q, pc, hdr, store, ncol: Math.max(hdr.length, q + 1) });

function upLines() {
  const out = { lines: [], warn: [], stores: [] }; if (!S.up) return out;
  const byName = {}, p = prodMap(); cat().forEach((x) => { byName[norm(x.name)] = x; });
  const acc = {};
  S.up.sheets.forEach((sh) => {
    if (sh.store && !out.stores.includes(sh.store)) out.stores.push(sh.store);
    for (let i = sh.h + 1; i < sh.rows.length; i++) {
      const r = sh.rows[i], raw = r[sh.q]; if (raw === '' || raw == null) continue;
      const code = String(r[0] == null ? '' : r[0]).trim().toUpperCase(), name = String(r[1] == null ? '' : r[1]).trim();
      if ((!code && !name) || /^total/i.test(name)) continue;
      let q = typeof raw === 'number' ? raw : parseFloat(String(raw).replace(',', '.'));
      if (!(q > 0)) { if (String(raw).trim() && String(raw).trim() !== '0') out.warn.push(sh.name + ' row ' + (i + 1) + ': "' + raw + '" is not a quantity, skipped.'); continue; }
      const pr = p[code] || byName[norm(name)];
      if (!pr) { out.warn.push(sh.name + ' row ' + (i + 1) + ': ' + (code || name) + ' is not in the product list, skipped.'); continue; }
      if (q !== Math.floor(q)) { out.warn.push(pr.code + ': ' + q + ' cases rounded up to ' + Math.ceil(q) + '.'); q = Math.ceil(q); }
      const sp = sh.pc >= 0 ? Number(r[sh.pc]) : NaN;
      if (sp > 0 && Math.abs(sp - pr.casePrice) / pr.casePrice > 0.005) out.warn.push(pr.code + ': the sheet price ' + money(sp) + ' differs from the current price ' + money(pr.casePrice) + '. The current price is used.');
      acc[pr.code] = (acc[pr.code] || 0) + q;
    }
  });
  Object.keys(acc).forEach((c) => out.lines.push({ pr: p[c], q: acc[c] }));
  return out;
}

function normDate(v) {

  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); }

}

  rows.slice(h + 1).forEach((r) => {

    const q = Number(String(r[qi] == null ? '' : r[qi]).replace(/[^0-9.\-]/g, ''));
    if (!(q > 0)) return;

  h += '<div class="tiles"><div class="tile"><div class="n">' + pre + '</div><div class="l">Products likely to reach par within 4 weeks on forecast demand</div></div>' +
    '<div class="tile"><div class="n">' + num(rows.reduce((a, r) => a + r.f.f4, 0)) + '</div><div class="l">Forecast cases, all products, next 4 weeks</div></div></div>';
  h += '<div class="scroll"><table><thead><tr><th>Product</th><th>Last 13 weeks</th><th class="num">Avg / week</th><th class="num">Next 4 weeks</th><th class="num">While closed</th><th class="num">Par</th><th class="num">Waiting now</th><th>Outlook</th><th>Confidence</th></tr></thead><tbody>';
  rows.slice(0, 150).forEach(({ c, pr, f, par, pend, gap }) => {
    const out = !par ? '<span class="muted small">Stock item</span>' : pend >= par ? '<span class="chip go">Already queued</span>' : f.f4 >= gap ? '<span class="chip near">Reaches par in ' + (f.trail > 0 ? Math.max(1, Math.ceil(gap / f.trail)) : '?') + ' wk</span>' : '<span class="chip far">Not within 4 weeks</span>';

  });
  h += '</tbody></table></div>';
  return h + viewImport();
}

/* ---------- history import ---------- */
async function importHistory() {
  const txt = $('#imp').value.trim(), replace = $('#impReplace').checked; if (!txt) return toast('Paste some rows first.');
  if (S.demo) return toast('Demo mode: nothing is saved.');
  const p = prodMap(), rows = [], bad = [], newStores = {};
  const known = {}; S.settings.stores.forEach((s) => { known[s.id] = 1; });
  txt.split(/\r?\n/).forEach((line, i) => {
    const f = line.split(/[,\t;]/).map((x) => x.trim()); if (f.length < 4 || !f[0] || /^date$/i.test(f[0])) return;
    let d = f[0]; const m = d.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/); if (m) d = m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
    const code = f[2].toUpperCase(), cases = Math.round(Number(f[3]));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || isNaN(Date.parse(d))) return bad.push('Line ' + (i + 1) + ': date "' + f[0] + '" is not YYYY-MM-DD');
    if (!p[code]) return bad.push('Line ' + (i + 1) + ': unknown code ' + f[2]);
    if (!(cases > 0)) return bad.push('Line ' + (i + 1) + ': cases must be above 0');
    const nm = f[1].replace(/^mantelli'?s direct\s*/i, ''), sid = slug(nm); if (!sid) return bad.push('Line ' + (i + 1) + ': store name is empty');
    if (!known[sid]) newStores[sid] = nm;
    rows.push({ order_date: d, store_id: sid, code, cases });
  });
  if (!rows.length) { S.importLog = 'Nothing imported.\n' + bad.slice(0, 10).join('\n'); return draw(true); }
  try {
    const ns = Object.keys(newStores).map((id) => ({ id, name: newStores[id], region: '' }));
    if (ns.length) await q(sb.from('stores').upsert(ns, { onConflict: 'id' }));
    if (replace) await q(sb.from('history').delete().gt('id', 0));
    for (let i = 0; i < rows.length; i += 500) await q(sb.from('history').insert(rows.slice(i, i + 500)));
    S.importLog = 'Imported ' + rows.length + ' lines.' + (ns.length ? ' Added stores: ' + ns.map((s) => s.name).join(', ') + '.' : '') + (bad.length ? '\nSkipped ' + bad.length + ':\n' + bad.slice(0, 10).join('\n') : '');
    await refresh();
  } catch (e) { S.importLog = 'Import failed: ' + e.message; }
  draw(true);
}

/* ---------- demo data (memory only) ---------- */
let backup = null;
function toggleDemo() {
  if (S.demo) { Object.assign(S, backup); S.demo = false; backup = null; draw(true); return; }
  backup = { orders: S.orders, hist: S.hist, settings: S.settings, pars: S.pars, me: S.me, cart: S.cart };
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const stores = ['Somerset West', 'Stellenbosch', 'Claremont', 'Durbanville', 'Paarl', 'Hermanus'].map((n) => ({ id: slug(n), name: n, fee: null }));
  const picks = cat().filter((p) => p.kind !== 'supply').filter((_, i) => i % 4 === 0).slice(0, 24);
  const hist = [], now = Date.now();
  for (let w = 60; w >= 1; w--) {
    const t0 = now - w * WEEK, month = new Date(t0).getUTCMonth();
    const season = (month >= 9 && month <= 11) ? 1.8 : (month >= 5 && month <= 7 ? 1.2 : 0.9);
    picks.forEach((p, pi) => {
      const base = (pi % 5 === 0) ? 6 : (pi % 3 === 0) ? 3 : 1.5, gift = /gift|hamper|funky mini/i.test(p.name + p.category) ? season : 1;
      stores.forEach((s) => {
        const n = Math.round(base * gift * (0.4 + rnd()) / 2);
        if (n > 0 && rnd() < 0.7) hist.push({ t: t0 + Math.floor(rnd() * 5) * DAY, store: s.id, code: p.code, cases: n });
      });
    });
  }
  const orders = [];
  stores.forEach((s, si) => {
    const lines = picks.filter((_, i) => (i + si) % 3 === 0).map((p, i) => ({ code: p.code, cases: 1 + ((i * 3 + si) % 6), price: p.casePrice, status: 'pending' }));
    orders.push({ id: 'demo' + si, uid: s.id, storeId: s.id, storeName: s.name, createdAt: now - si * DAY, createdBy: 'demo', method: si % 2 ? 'deliver' : 'collect', fee: si % 2 ? 350 : 0, palletKg: si % 2 ? 420 : null, needBy: '', notes: '', lines });
  });
  S.demo = true; S.hist = hist; S.orders = orders; S.settings = Object.assign({}, S.settings, { stores }); S.me = { storeId: stores[0].id }; S.cart = {};
  S.tab = 'forecast'; draw(true);
}

/* ---------- boot ---------- */
let polling = false;
async function start(session) {
  S.userId = session.user.id; S.demo = false;
  try { const prof = await q(sb.from('profiles').select('*').eq('id', S.userId)); S.profile = prof[0] || null; }
  catch (e) { S.authMsg = 'Could not load your profile: ' + e.message; S.auth = 'login'; return draw(); }
  if (!S.profile || (S.profile.role !== 'hq' && !S.profile.store_id)) { S.auth = 'nostore'; return draw(); }
  S.admin = S.profile.role === 'hq';
  S.me.storeId = S.admin ? null : S.profile.store_id;
  if (S.admin) { try { S.me.storeId = localStorage.getItem('mantellis-store') || null; } catch (e) {} }
  S.auth = 'in'; S.tab = 'board';
  try { await loadAll(); S.conn = 'ok'; } catch (e) { S.conn = 'error'; }
  draw(true);
  if (!polling) { polling = true; setInterval(() => { if (!document.hidden) refresh(); }, 15000); }
}
async function boot() {
  try { S.cart = JSON.parse(localStorage.getItem('mantellis-cart') || '{}') || {}; } catch (e) { S.cart = {}; }
  const cfg = window.APP_CONFIG;
  if (!cfg || !cfg.url || !cfg.anonKey || /YOUR-/.test(cfg.url + cfg.anonKey) || !window.supabase) { S.auth = 'config'; return draw(); }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { S.auth = 'recover'; draw(); }
    else if (ev === 'SIGNED_OUT') { S.auth = 'login'; S.admin = false; S.profile = null; S.orders = []; S.userId = null; S.demo = false; draw(); }
  });
  const { data } = await sb.auth.getSession();
  if (S.auth === 'recover') return;
  if (data && data.session) await start(data.session); else { S.auth = 'login'; draw(); }
}
boot();
</script>
